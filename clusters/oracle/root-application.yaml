apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oracle-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Disease-Prediction-ASET26/disease-prediction-gitops.git
    targetRevision: main
    path: clusters/oracle
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
