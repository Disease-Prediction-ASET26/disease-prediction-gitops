apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-vault-canary
  namespace: disease-prediction
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: oci-vault
    kind: SecretStore
  target:
    name: oci-vault-canary
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        key: eso-canary
