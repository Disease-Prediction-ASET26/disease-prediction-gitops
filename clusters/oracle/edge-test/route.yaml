apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: edge-test-nginx
  namespace: disease-prediction
  labels:
    external-dns-public: "true"
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: oracle-public
      namespace: traefik-system
      sectionName: web
  hostnames:
    - external-dns-test.pocket-doc.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: edge-test-nginx
          port: 8080
