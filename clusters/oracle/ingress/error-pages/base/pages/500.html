<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8fa">
    <title>Internal server error</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172b42;
        background: #f6f8fa;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }
      main {
        width: min(100%, 520px);
        padding: clamp(30px, 8vw, 56px);
        border: 1px solid #dce3ea;
        background: #fff;
      }
      .face {
        display: inline-block;
        margin: 0 0 32px;
        color: #177b78;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: .02em;
        animation: drift 3.2s ease-in-out infinite;
      }
      @keyframes drift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      .code {
        margin: 0 0 12px;
        color: #177b78;
        font-size: clamp(52px, 12vw, 72px);
        font-weight: 680;
        letter-spacing: -.065em;
        line-height: 1;
      }
      h1 {
        margin: 0;
        font-size: clamp(22px, 5vw, 27px);
        font-weight: 650;
        letter-spacing: -.035em;
        line-height: 1.25;
      }
      .message {
        margin: 14px 0 0;
        color: #52657a;
        font-size: 15px;
        line-height: 1.65;
      }
      .hint {
        margin: 5px 0 0;
        color: #5f7185;
        font-size: 14px;
        line-height: 1.6;
      }
      form { margin: 28px 0 0; }
      button {
        padding: 12px 18px;
        border: 1px solid #172b42;
        border-radius: 0;
        background: #172b42;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #2b4056; }
      button:focus-visible {
        outline: 3px solid #177b78;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .face { animation: none; }
      }
      @media (max-width: 480px) {
        body { padding: 16px; }
        main { padding: 30px 26px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="face" aria-hidden="true">:(</p>
      <section aria-labelledby="error-title">
        <p class="code" aria-label="HTTP status code 500">500</p>
        <h1 id="error-title">Internal server error</h1>
        <p class="message">Something went wrong while handling your request.</p>
        <p class="hint">Please try again shortly.</p>
      </section>
      <form action="" method="get">
        <button type="submit">Try again</button>
      </form>
    </main>
  </body>
</html>
