<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>Bad gateway · Pocket Doc</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172b42;
        background: #f4f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }
      main {
        width: min(100%, 520px);
        padding: 42px 44px 32px;
        border: 1px solid #e4eaf1;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 52px rgb(30 55 82 / 8%);
      }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 650; letter-spacing: .01em; }
      .brand-mark {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 9px;
        background: #e8f5f4;
        color: #177b78;
        font-size: 15px;
        font-weight: 750;
      }
      .content { padding: 48px 0 38px; }
      .eyebrow { margin: 0 0 12px; color: #607286; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .code { margin: 0 0 7px; color: #177b78; font-size: clamp(50px, 12vw, 68px); font-weight: 720; letter-spacing: -.065em; line-height: 1; }
      h1 { margin: 0; font-size: clamp(22px, 5vw, 27px); font-weight: 650; letter-spacing: -.035em; line-height: 1.25; }
      .message { margin: 14px 0 0; color: #52657a; font-size: 15px; line-height: 1.65; }
      .hint { margin: 5px 0 0; color: #5f7185; font-size: 14px; line-height: 1.6; }
      footer { padding-top: 18px; border-top: 1px solid #edf0f4; color: #607286; font-size: 12px; }
      @media (max-width: 480px) { main { padding: 30px 26px 24px; } .content { padding: 40px 0 32px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="brand-mark" aria-hidden="true">P</span><span>Pocket Doc</span></div>
      <section class="content" aria-labelledby="error-title">
        <p class="eyebrow">Request could not be completed</p>
        <p class="code" aria-label="HTTP status code 502">502</p>
        <h1 id="error-title">Bad gateway</h1>
        <p class="message">We couldn't get a response from the service.</p>
        <p class="hint">Please try again in a moment.</p>
      </section>
      <footer>HTTP error code · 502</footer>
    </main>
  </body>
</html>
