apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - middleware.yaml
  - networkpolicy.yaml
  - service.yaml
configMapGenerator:
  - name: traefik-error-pages
    files:
      - pages/500.html
      - pages/502.html
      - pages/503.html
      - pages/504.html
generatorOptions:
  labels:
    app.kubernetes.io/name: traefik-error-pages
