apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  labels:
    external-dns-public: "true"
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: oracle-public
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik-system
      sectionName: web
  hostnames:
    - argocd.pocket-doc.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          group: ""
          kind: Service
          port: 80
          weight: 1
