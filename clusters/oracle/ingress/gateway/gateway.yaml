apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oracle-public
  namespace: traefik-system
  labels:
    external-dns.pocket-doc.app/eligible: "true"
  annotations:
    external-dns.kubernetes.io/target: "d7bfa34e-30b1-4c02-8aad-b9fe4bd1d050.cfargotunnel.com"
spec:
  gatewayClassName: oracle-public
  listeners:
    - name: web
      hostname: "*.pocket-doc.app"
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              pocket-doc.app/public-routes: "true"
    - name: websecure
      hostname: auth.pocket-doc.app
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: authelia-origin-tls
            namespace: auth-system
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              pocket-doc.app/public-routes: "true"
