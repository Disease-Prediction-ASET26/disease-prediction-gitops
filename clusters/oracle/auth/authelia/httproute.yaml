apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: auth-system
  labels:
    external-dns-public: "true"
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: oracle-public
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik-system
      sectionName: web
    - name: oracle-public
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik-system
      sectionName: websecure
  hostnames:
    - auth.pocket-doc.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authelia
          group: ""
          kind: Service
          port: 9091
          weight: 1
