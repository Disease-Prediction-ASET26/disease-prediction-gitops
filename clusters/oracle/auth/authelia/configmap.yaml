apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth-system
data:
  configuration.yml: |
    server:
      address: 'tcp://0.0.0.0:9091/'
      disable_healthcheck: true

    log:
      level: info

    theme: auto
    default_2fa_method: webauthn

    totp:
      issuer: pocket-doc.app
      disable: true

    webauthn:
      display_name: pocket-doc.app
      enable_passkey_login: false

    notifier:
      smtp: {}

    authentication_backend:
      password_reset:
        disable: true
      password_change:
        disable: true
      file:
        path: /run/secrets/users/users_database.yml
        watch: false
        password:
          algorithm: argon2
          argon2:
            variant: argon2id
            iterations: 3
            memory: 65536
            parallelism: 4
            key_length: 32
            salt_length: 16

    access_control:
      default_policy: deny
      rules:
        - domain: '*.pocket-doc.app'
          policy: two_factor

    session:
      cookies:
        - domain: pocket-doc.app
          authelia_url: https://auth.pocket-doc.app
      expiration: 12h
      inactivity: 30m
      remember_me: 30d
      same_site: lax

    storage:
      local:
        path: /data/db.sqlite3

    identity_validation:
      reset_password:
        jwt_lifespan: 5 minutes

    identity_providers:
      oidc:
        issuer: https://auth.pocket-doc.app
        jwks:
          - key_id: authelia-oidc-2026
            algorithm: RS256
            use: sig
            key: {{ secret "/run/secrets/core/oidc_signing_private_key" | mindent 10 "|" | msquote }}
        clients:
          - client_id: argocd
            client_name: Argo CD
            client_secret: {{ secret "/run/secrets/core/argocd_oidc_client_secret_hash" | msquote }}
            public: false
            authorization_policy: two_factor
            require_pkce: false
            redirect_uris:
              - https://argocd.pocket-doc.app/auth/callback
            scopes:
              - openid
              - groups
              - email
            response_types:
              - code
            grant_types:
              - authorization_code
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
          - client_id: argocd-cli
            client_name: Argo CD CLI
            public: true
            authorization_policy: two_factor
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - http://localhost:8085/auth/callback
            scopes:
              - openid
              - offline_access
              - groups
              - email
            response_types:
              - code
            grant_types:
              - authorization_code
              - refresh_token
            access_token_signed_response_alg: none
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: none

    password_policy:
      zxcvbn:
        enabled: true
        min_score: 4
