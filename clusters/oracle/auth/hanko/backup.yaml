apiVersion: v1
kind: ConfigMap
metadata:
  name: hanko-backup-script
  namespace: auth-system
data:
  upload.py: |
    import datetime
    import http.client
    import os
    import pathlib
    import ssl
    import sys
    import urllib.parse

    try:
        base = urllib.parse.urlsplit(os.environ['UPLOAD_URL'])
        if base.scheme != 'https' or not base.hostname or base.query or base.fragment:
            raise ValueError('invalid upload URL')
        stamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
        for name in ('dev', 'prod'):
            filename = pathlib.Path('/backup') / (name + '.dump')
            path = base.path.rstrip('/') + '/hanko/' + name + '/' + stamp + '.dump'
            conn = http.client.HTTPSConnection(base.hostname, base.port or 443,
                                               timeout=180, context=ssl.create_default_context())
            with filename.open('rb') as source:
                conn.request('PUT', path, body=source,
                             headers={'Content-Length': str(filename.stat().st_size),
                                      'Content-Type': 'application/octet-stream'})
                response = conn.getresponse()
                response.read()
                if response.status not in (200, 201):
                    raise RuntimeError('upload failed with HTTP ' + str(response.status))
            conn.close()
            print(name + ' backup uploaded', flush=True)
    except Exception as exc:
        print('Backup upload failed:', type(exc).__name__, flush=True)
        sys.exit(1)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hanko-backup
  namespace: auth-system
spec:
  schedule: "17 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hanko-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/arch: arm64
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
              command: [sh, -c]
              args:
                - |
                  set -eu
                  umask 077
                  export PGPASSWORD="$DEV_PASSWORD"
                  ready=false
                  for attempt in $(seq 1 30); do
                    if pg_isready -h hanko-postgres.auth-system.svc.cluster.local -U hanko_dev -d hanko_dev >/dev/null 2>&1; then
                      ready=true
                      break
                    fi
                    sleep 2
                  done
                  "$ready" || { echo 'PostgreSQL did not become reachable'; exit 1; }
                  pg_dump -h hanko-postgres.auth-system.svc.cluster.local -U hanko_dev -d hanko_dev -Fc --no-owner --no-acl -f /backup/dev.dump
                  export PGPASSWORD="$PROD_PASSWORD"
                  pg_dump -h hanko-postgres.auth-system.svc.cluster.local -U hanko_prod -d hanko_prod -Fc --no-owner --no-acl -f /backup/prod.dump
              env:
                - {name: PGSSLMODE, value: verify-full}
                - {name: PGSSLROOTCERT, value: /run/postgres-ca/ca.crt}
                - name: DEV_PASSWORD
                  valueFrom: {secretKeyRef: {name: hanko-postgres, key: dev-password}}
                - name: PROD_PASSWORD
                  valueFrom: {secretKeyRef: {name: hanko-postgres, key: prod-password}}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: postgres-ca, mountPath: /run/postgres-ca, readOnly: true}
          containers:
            - name: upload
              image: python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
              command: [python, /scripts/upload.py]
              env:
                - name: UPLOAD_URL
                  valueFrom: {secretKeyRef: {name: hanko-backup-upload, key: url}}
              resources:
                requests: {cpu: 25m, memory: 32Mi}
                limits: {cpu: 250m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup, readOnly: true}
                - {name: scripts, mountPath: /scripts, readOnly: true}
          volumes:
            - name: backup
              emptyDir: {sizeLimit: 3Gi}
            - name: postgres-ca
              secret: {secretName: hanko-postgres-ca}
            - name: scripts
              configMap: {name: hanko-backup-script}
