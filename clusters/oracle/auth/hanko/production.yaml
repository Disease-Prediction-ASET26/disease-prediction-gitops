apiVersion: v1
kind: ConfigMap
metadata:
  name: hanko-prod-config
  namespace: auth-system
data:
  config.yaml: |
    database:
      host: hanko-postgres.auth-system.svc.cluster.local
      port: "5432"
      database: hanko_prod
      user: hanko_prod
      dialect: postgres
      pool: 5
    account:
      allow_signup: false
    third_party:
      redirect_url: https://identity.pocket-doc.app/thirdparty/callback
      error_redirect_url: https://health.pocket-doc.app
      default_redirect_url: https://health.pocket-doc.app
      allowed_redirect_urls:
        - https://health.pocket-doc.app
      providers:
        google:
          enabled: true
          allow_linking: false
    server:
      ip:
        extractor: x_forwarded_for
        trusted_proxies:
          - 10.42.0.0/16
    service:
      name: Pocket Doc
    email_delivery:
      enabled: true
      from_name: Pocket Doc
    cors:
      allow_origins:
        - https://health.pocket-doc.app
    webauthn:
      relying_party:
        id: health.pocket-doc.app
        display_name: Pocket Doc
        origins:
          - https://health.pocket-doc.app
    session:
      issuer: https://identity.pocket-doc.app
      audience:
        - pocket-doc-prod
      lifespan: 15m
      acquire_ip_address: false
      enable_auth_token_header: true
      cookie:
        secure: true
        http_only: true
        same_site: lax
    rate_limiter:
      enabled: true
      store: in_memory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hanko-prod
  namespace: auth-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hanko-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hanko-prod
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/teamhanko/hanko:v3.1.0@sha256:80ea5d67937cb3674bdde157365c57ff04420d5337f1277232d47e858613b19c
          command: [/hanko, --config, /config/config.yaml, migrate, up]
          env: &hankoEnv
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: hanko-prod, key: database-url}
            - name: SECRETS_KEYS
              valueFrom:
                secretKeyRef: {name: hanko-prod, key: encryption-key}
            - name: THIRD_PARTY_PROVIDERS_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: hanko-google-prod, key: client-id}
            - name: THIRD_PARTY_PROVIDERS_GOOGLE_SECRET
              valueFrom:
                secretKeyRef: {name: hanko-google-prod, key: client-secret}
            - name: EMAIL_DELIVERY_SMTP_HOST
              valueFrom:
                secretKeyRef: {name: hanko-smtp, key: host}
            - name: EMAIL_DELIVERY_SMTP_PORT
              valueFrom:
                secretKeyRef: {name: hanko-smtp, key: port}
            - name: EMAIL_DELIVERY_SMTP_USER
              valueFrom:
                secretKeyRef: {name: hanko-smtp, key: username}
            - name: EMAIL_DELIVERY_SMTP_PASSWORD
              valueFrom:
                secretKeyRef: {name: hanko-smtp, key: password}
            - name: EMAIL_DELIVERY_FROM_ADDRESS
              valueFrom:
                secretKeyRef: {name: hanko-smtp, key: from-address}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: postgres-ca, mountPath: /run/postgres-ca, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: &secure
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: hanko
          image: ghcr.io/teamhanko/hanko:v3.1.0@sha256:80ea5d67937cb3674bdde157365c57ff04420d5337f1277232d47e858613b19c
          command: [/hanko, --config, /config/config.yaml, serve, all]
          env: *hankoEnv
          ports:
            - {name: public, containerPort: 8000, protocol: TCP}
          startupProbe:
            httpGet: {path: /health/ready, port: public}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health/ready, port: public}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/alive, port: public}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: *secure
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: postgres-ca, mountPath: /run/postgres-ca, readOnly: true}
      volumes:
        - name: config
          configMap: {name: hanko-prod-config}
        - name: postgres-ca
          secret:
            secretName: hanko-postgres-ca
---
apiVersion: v1
kind: Service
metadata:
  name: hanko-prod
  namespace: auth-system
spec:
  selector: {app.kubernetes.io/name: hanko-prod}
  ports:
    - {name: public, port: 8000, targetPort: public}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hanko-prod
  namespace: auth-system
  labels:
    external-dns-public: "true"
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: oracle-public
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: traefik-system
      sectionName: web
  hostnames:
    - identity.pocket-doc.app
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: hanko-prod
          group: ""
          kind: Service
          port: 8000
          weight: 1
