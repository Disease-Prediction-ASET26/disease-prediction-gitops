apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hanko-postgres-backup-ingress
  namespace: auth-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hanko-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hanko-backup
      ports:
        - {protocol: TCP, port: 5432}
