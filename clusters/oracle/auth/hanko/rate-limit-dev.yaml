apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hanko-dev-flow-cors
  namespace: auth-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  headers:
    accessControlAllowCredentials: true
    accessControlAllowOriginList:
      - https://dev.pocket-doc.app
      - http://localhost:5173
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hanko-dev-flow-client-limit
  namespace: auth-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  rateLimit:
    average: 40
    period: 1m
    burst: 20
    sourceCriterion:
      # Cloudflare sets this header. The web entry point is reachable only by
      # cloudflared; a client-supplied X-Forwarded-For value is not trusted.
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hanko-dev-flow-total-limit
  namespace: auth-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  rateLimit:
    average: 300
    period: 1m
    burst: 60
    sourceCriterion:
      requestHost: true
