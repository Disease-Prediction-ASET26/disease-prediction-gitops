apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana-oidc-ca.yaml
configMapGenerator:
  - name: grafana-dashboard-kubernetes-fleet
    files:
      - dashboards/fleet-overview.json
  - name: grafana-dashboard-kubernetes-detail
    files:
      - dashboards/cluster-detail.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
