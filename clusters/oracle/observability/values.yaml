defaultRules:
  create: false

alertmanager:
  enabled: false

grafana:
  enabled: true
  rbac:
    namespaced: true
  hostAliases:
    # Match Argo CD's private OIDC path through Traefik's HTTPS Gateway.
    - ip: 10.43.66.80
      hostnames:
        - auth.pocket-doc.app
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 250m
      memory: 512Mi
  service:
    type: ClusterIP
    annotations:
      traefik.io/service.nativelb: "true"
  serviceMonitor:
    enabled: false
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc-client
        key: clientSecret
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://proxmox-prometheus.monitoring.svc.cluster.local:9090/
          access: proxy
          isDefault: true
          editable: false
          jsonData:
            timeInterval: 60s
  extraConfigmapMounts:
    - name: grafana-oidc-ca
      mountPath: /etc/grafana/oidc-certs
      configMap: grafana-oidc-ca
      readOnly: true
  grafana.ini:
    server:
      domain: grafana.pocket-doc.app
      root_url: https://grafana.pocket-doc.app
    auth:
      disable_login_form: true
    auth.basic:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: Authelia
      icon: signin
      allow_sign_up: true
      client_id: grafana
      scopes: openid profile email groups
      empty_scopes: false
      auth_url: https://auth.pocket-doc.app/api/oidc/authorization
      token_url: https://auth.pocket-doc.app/api/oidc/token
      api_url: https://auth.pocket-doc.app/api/oidc/userinfo
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      name_attribute_path: name
      use_pkce: true
      auth_style: InHeader
      role_attribute_path: "contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'"
      role_attribute_strict: true
      allow_assign_grafana_admin: true
      tls_client_ca: /etc/grafana/oidc-certs/cloudflare-origin-ca.pem
    security:
      cookie_secure: true
  sidecar:
    dashboards:
      searchNamespace: monitoring
      # Grafana's file provider polls every 30s; avoid Basic-auth reload calls.
      skipReload: true
      provider:
        updateIntervalSeconds: 30
    datasources:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

kubeApiServer:
  enabled: false

# K3s combines the control-plane processes; these metrics endpoints are unavailable.
kubeControllerManager:
  enabled: false

kubelet:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

# The chart places its CoreDNS metrics Service in kube-system, outside this
# application's allowed namespaces.
coreDns:
  enabled: false

kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheusOperator:
  enabled: false

prometheus:
  enabled: false
