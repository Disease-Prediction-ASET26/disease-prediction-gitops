apiVersion: v1
kind: Service
metadata:
  name: oracle-kube-state-metrics-tailnet
  namespace: monitoring
  annotations:
    tailscale.com/hostname: oracle-kube-state-metrics-tailnet
    tailscale.com/proxy-class: tailscale-proxies
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/tags: tag:oracle-metrics
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: metrics
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/name: kube-state-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: oracle-node-exporter-tailnet
  namespace: node-exporter
  annotations:
    tailscale.com/hostname: oracle-node-exporter-tailnet
    tailscale.com/proxy-class: tailscale-proxies
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/tags: tag:oracle-metrics
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: metrics
      port: 9100
      protocol: TCP
      targetPort: http-metrics
  selector:
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/name: prometheus-node-exporter
