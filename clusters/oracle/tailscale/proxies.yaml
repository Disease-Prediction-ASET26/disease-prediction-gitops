apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-proxies
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: egress-proxies
  namespace: tailscale
spec:
  type: egress
  replicas: 1
  tags:
    - tag:oracle-k3s-egress
  proxyClass: tailscale-proxies
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: egress-prod
  namespace: tailscale
spec:
  type: egress
  replicas: 1
  tags:
    - tag:oracle-prod-egress
  proxyClass: tailscale-proxies
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: ingress-proxies
  namespace: tailscale
spec:
  type: ingress
  replicas: 1
  tags:
    - tag:oracle-k3s-ingress
  proxyClass: tailscale-proxies
