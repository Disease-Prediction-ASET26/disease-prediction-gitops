  namespace: disease-prediction
spec:
  ingress: []
  egress:
    - egress-proxies
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroupPolicy
metadata:
  name: tailscale-egress
  namespace: monitoring
spec:
  ingress:
    - ingress-proxies
  egress:
    - egress-proxies
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroupPolicy
metadata:
  name: tailscale-proxies
  namespace: node-exporter
spec:
  ingress:
    - ingress-proxies
  egress: []
