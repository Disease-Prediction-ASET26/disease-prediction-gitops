apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployments.yaml
  - services.yaml
  - httproute.yaml
  - quota.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: disease-prediction-config
    namespace: disease-prediction-prod
    envs:
      - config.env
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=true
