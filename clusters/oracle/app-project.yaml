apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oracle-apps
  namespace: argocd
spec:
  description: Application deployments for the Oracle k3s demo
  sourceRepos:
    - git@github.com:Disease-Prediction-ASET26/disease-prediction-gitops.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: disease-prediction
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
