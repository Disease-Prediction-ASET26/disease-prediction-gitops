apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: disease-prediction-dev
  namespace: disease-prediction
  labels:
    external-dns-public: "true"
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: oracle-public
      kind: Gateway
      group: gateway.networking.k8s.io
      namespace: traefik-system
      sectionName: web
  hostnames:
    - dev.pocket-doc.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          group: ""
          kind: Service
          port: 8080
          weight: 1
