apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: disease-prediction-dev
  namespace: disease-prediction
  labels:
    external-dns-public: "true"
  annotations:
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: oracle-public
      namespace: traefik-system
      sectionName: web
  hostnames:
    - dev.pocket-doc.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia-forwardauth
      backendRefs:
        - name: frontend
          port: 8080
