apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-route
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: oracle-observability
  source:
    repoURL: https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
    targetRevision: main
    path: clusters/oracle/observability/route
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Publish Grafana only after the OIDC client Secret and Grafana SSO config are ready.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
