apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: oracle-observability
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.17.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/clusters/oracle/observability/values.yaml
    - repoURL: https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
      targetRevision: main
      path: clusters/oracle/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
