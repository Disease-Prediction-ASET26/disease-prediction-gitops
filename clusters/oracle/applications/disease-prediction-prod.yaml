apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: disease-prediction-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: oracle-apps
  source:
    repoURL: https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
    targetRevision: main
    path: clusters/oracle/disease-prediction-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: disease-prediction-prod
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
