apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-auth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: oracle-auth
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      releaseName: external-secrets-auth
      values: |
        installCRDs: false

        # This controller reconciles SecretStores and ExternalSecrets only in
        # auth-system and uses a distinct controller class from the other ESO instances.
        scopedRBAC: true
        scopedNamespace: auth-system
        controllerClass: oracle-auth-secrets
        leaderElect: false
        leaderElectionID: external-secrets-auth-controller

        processClusterExternalSecret: false
        processClusterPushSecret: false
        processClusterStore: false
        processClusterGenerator: false
        processPushSecret: false
        processSecretStore: true

        crds:
          createClusterExternalSecret: false
          createClusterSecretStore: false
          createSecretStore: false
          createClusterGenerator: false
          createClusterPushSecret: false
          createPushSecret: false

        webhook:
          create: false
        certController:
          create: false

        rbac:
          leaderElection:
            create: false
          serviceAccountTokenCreate: false
          servicebindings:
            create: false
          aggregateToView: false
          aggregateToEdit: false
          aggregateToAdmin: false

        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 192Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
