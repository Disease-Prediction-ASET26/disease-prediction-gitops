apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia-forwardauth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: oracle-apps
  source:
    repoURL: https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
    targetRevision: main
    path: clusters/oracle/apps/authelia-forwardauth
  destination:
    server: https://kubernetes.default.svc
    namespace: disease-prediction
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
