apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hanko-backup-upload
  namespace: auth-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault-auth
    kind: SecretStore
  target:
    name: hanko-backup-upload
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: hanko-backup-upload
        property: url
