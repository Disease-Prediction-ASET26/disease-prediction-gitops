apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hanko-postgres-ca
  namespace: auth-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault-auth
    kind: SecretStore
  target:
    name: hanko-postgres-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: hanko-postgres-tls
        property: ca_cert
