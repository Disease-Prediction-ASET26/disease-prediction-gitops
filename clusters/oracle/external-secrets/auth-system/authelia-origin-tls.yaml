apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-origin-tls
  namespace: auth-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault-auth
    kind: SecretStore
  target:
    name: authelia-origin-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: authelia-origin-tls-cert
    - secretKey: tls.key
      remoteRef:
        key: authelia-origin-tls-key
