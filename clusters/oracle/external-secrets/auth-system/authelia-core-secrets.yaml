apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-core-secrets
  namespace: auth-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault-auth
    kind: SecretStore
  target:
    name: authelia-core-secrets
    creationPolicy: Owner
  data:
    - secretKey: session_secret
      remoteRef:
        key: authelia-session-secret
    - secretKey: storage_encryption_key
      remoteRef:
        key: authelia-storage-encryption-key
    - secretKey: reset_password_jwt_secret
      remoteRef:
        key: authelia-reset-password-jwt-secret
    - secretKey: oidc_hmac_secret
      remoteRef:
        key: authelia-oidc-hmac-secret
    - secretKey: oidc_signing_private_key
      remoteRef:
        key: authelia-oidc-signing-key
    - secretKey: argocd_oidc_client_secret_hash
      remoteRef:
        key: authelia-argocd-client-secret-hash
    - secretKey: grafana_oidc_client_secret_hash
      remoteRef:
        key: authelia-grafana-client-secret-hash
