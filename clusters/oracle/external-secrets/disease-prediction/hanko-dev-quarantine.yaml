apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hanko-dev-quarantine
  namespace: disease-prediction
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: SecretStore
  target:
    name: hanko-dev-quarantine
    creationPolicy: Owner
  data:
    - secretKey: subjects
      remoteRef:
        key: hanko-dev-quarantine
        property: subjects
