apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: disease-prediction-runtime-secrets
  namespace: disease-prediction-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: SecretStore
  target:
    name: disease-prediction-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATA_ENCRYPTION_KEY
      remoteRef:
        key: disease-prediction-runtime-secrets-prod
        property: data_encryption_key
