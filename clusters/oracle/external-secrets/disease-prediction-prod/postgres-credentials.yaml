apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  namespace: disease-prediction-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: oci-vault
    kind: SecretStore
  target:
    name: postgres-app-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: disease_prediction_prod
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: proxmox-postgres-credentials-prod
        property: password
