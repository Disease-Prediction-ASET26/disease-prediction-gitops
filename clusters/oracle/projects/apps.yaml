apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oracle-apps
  namespace: argocd
spec:
  description: Application deployments for the Oracle k3s demo
  sourceRepos:
    - https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
  destinations:
    - namespace: disease-prediction
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: SecretStore
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: traefik.io
      kind: Middleware
