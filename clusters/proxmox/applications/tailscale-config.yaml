apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: proxmox-tailscale-config
  source:
    repoURL: https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
    targetRevision: main
    path: clusters/proxmox/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
