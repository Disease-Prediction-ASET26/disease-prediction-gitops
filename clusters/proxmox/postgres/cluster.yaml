apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  enableSuperuserAccess: false
  certificates:
    serverAltDNSNames:
      - proxmox-postgres.tail0bed44.ts.net
      - proxmox-postgres.disease-prediction.svc.cluster.local
      - proxmox-postgres.disease-prediction-prod.svc.cluster.local
  bootstrap:
    initdb:
      database: disease_prediction_dev
      owner: disease_prediction_dev
      secret:
        name: postgres-app-credentials-dev
  storage:
    size: 10Gi
    storageClass: local-path
  managed:
    services:
      additional:
        - selectorType: rw
          updateStrategy: patch
          serviceTemplate:
            metadata:
              name: postgres-tailnet
              annotations:
                tailscale.com/proxy-group: ingress-proxies
                tailscale.com/hostname: proxmox-postgres
                tailscale.com/tags: tag:proxmox-postgres
                tailscale.com/proxy-class: tailscale-proxies
            spec:
              type: LoadBalancer
              loadBalancerClass: tailscale
        - selectorType: rw
          updateStrategy: patch
          serviceTemplate:
            metadata:
              name: postgres-metrics
              labels:
                app.kubernetes.io/name: postgres-metrics
            spec:
              type: ClusterIP
              ports:
                - name: metrics
                  port: 9187
                  protocol: TCP
                  targetPort: metrics
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
