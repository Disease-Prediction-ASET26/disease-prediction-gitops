apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: disease-prediction-production
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: disease_prediction_prod
  login: true
  superuser: false
  createdb: false
  connectionLimit: 20
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: postgres-app-credentials-prod
