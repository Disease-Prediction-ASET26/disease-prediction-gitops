operatorConfig:
  hostname: proxmox-tailscale-operator
  defaultTags:
    - tag:k8s-operator
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

proxyConfig:
  defaultTags: tag:k8s-proxmox
  defaultProxyClass: tailscale-proxies

ingressClass:
  enabled: false
