apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: local-vault
  namespace: disease-prediction
spec:
  provider:
    vault:
      server: http://vault-active.vault-system.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: proxmox-apps
          serviceAccountRef:
            name: vault-secret-reader
            audiences:
              - vault
