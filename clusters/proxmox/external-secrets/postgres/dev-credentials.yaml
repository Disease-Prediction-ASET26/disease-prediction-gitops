apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials-dev
  namespace: postgres
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: local-vault
    kind: SecretStore
  target:
    name: postgres-app-credentials-dev
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: disease_prediction_dev
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: proxmox/postgres/disease-prediction-dev
        property: password
