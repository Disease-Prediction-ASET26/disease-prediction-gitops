apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: disease-prediction-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: local-vault
    kind: SecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: "{{ .config | toString }}"
  data:
    - secretKey: config
      remoteRef:
        key: proxmox/apps/ghcr-pull
        property: dockerconfigjson
