apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proxmox-secrets
  namespace: argocd
spec:
  description: External Secrets Operator and local Vault references
  sourceRepos:
    - https://charts.external-secrets.io
    - https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
  destinations:
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: postgres
      server: https://kubernetes.default.svc
    - namespace: disease-prediction
      server: https://kubernetes.default.svc
    - namespace: disease-prediction-dev
      server: https://kubernetes.default.svc
    - namespace: disease-prediction-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: SecretStore
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
