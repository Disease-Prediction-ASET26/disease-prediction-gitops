apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proxmox-ai
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Disease Prediction inference workloads on Proxmox
  sourceRepos:
    - https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
  destinations:
    - namespace: disease-prediction-dev
      server: https://kubernetes.default.svc
    - namespace: disease-prediction-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: NetworkPolicy
