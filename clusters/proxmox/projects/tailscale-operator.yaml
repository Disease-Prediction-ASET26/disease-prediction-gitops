apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proxmox-tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Tailscale Kubernetes Operator for the Proxmox cluster
  sourceRepos:
    - https://pkgs.tailscale.com/helmcharts
    - https://github.com/Disease-Prediction-ASET26/disease-prediction-gitops.git
  destinations:
    - namespace: tailscale
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: ""
      kind: ServiceAccount
