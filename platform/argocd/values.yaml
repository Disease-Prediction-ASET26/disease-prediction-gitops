global:
  image:
    tag: v3.5.6
  domain: argocd.pocket-doc.app

dex:
  enabled: false

redis-ha:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

configs:
  cm:
    url: https://argocd.pocket-doc.app
    admin.enabled: "false"
    users.anonymous.enabled: "false"
    oidc.config: |
      name: Authelia
      issuer: https://auth.pocket-doc.app
      clientID: argocd
      clientSecret: '$argocd-oidc-client:clientSecret'
      cliClientID: argocd-cli
      requestedScopes:
        - openid
        - email
        - groups
      enableUserInfoGroups: true
      userInfoPath: /api/oidc/userinfo
  rbac:
    policy.default: role:authenticated
    policy.csv: |
      g, admins, role:admin
    scopes: '[groups]'
  params:
    server.insecure: true
