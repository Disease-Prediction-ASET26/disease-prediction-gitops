name: Validate GitOps manifests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secret-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: Disease-Prediction-ASET26/disease-prediction-ci/.github/workflows/secret-scan.yml@76e94bd640d92a3ffbf20e9cd5914e22b5ca40cd # shared secret scan
    permissions:
      contents: read
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render cluster manifests
        run: |
          kustomize build clusters/oracle > /dev/null
          kustomize build clusters/proxmox > /dev/null
          for app_path in \
            clusters/oracle/auth/authelia \
            clusters/oracle/edge/cloudflared \
            clusters/oracle/ingress/authelia-forwardauth \
            clusters/oracle/ingress/argocd \
            clusters/oracle/ingress/gateway \
            clusters/oracle/ingress/traefik-access \
            clusters/oracle/external-secrets/argocd \
            clusters/oracle/external-secrets/auth-system \
            clusters/oracle/external-secrets/disease-prediction \
            clusters/oracle/external-secrets/edge-system \
            clusters/oracle/external-secrets/monitoring \
            clusters/oracle/observability \
            clusters/oracle/observability/route \
            clusters/oracle/policies/disease-prediction-quota; do
            kustomize build "$app_path" > /dev/null
          done
      - name: Install pinned Ansible Core
        run: |
          python3 -m venv "${RUNNER_TEMP}/ansible-venv"
          "${RUNNER_TEMP}/ansible-venv/bin/python" -m pip install --disable-pip-version-check -r requirements-ansible.txt
      - name: Check Ansible playbook syntax
        run: |
          "${RUNNER_TEMP}/ansible-venv/bin/ansible-playbook" --syntax-check -i 'localhost,' clusters/oracle/automation/ansible/playbooks/tailscale.yml
          "${RUNNER_TEMP}/ansible-venv/bin/ansible-playbook" --syntax-check -i 'localhost,' clusters/oracle/automation/ansible/playbooks/remove-tailscale.yml
          "${RUNNER_TEMP}/ansible-venv/bin/ansible-playbook" --syntax-check -i 'localhost,' clusters/oracle/automation/ansible/playbooks/log-retention.yml
          "${RUNNER_TEMP}/ansible-venv/bin/ansible-playbook" --syntax-check -i 'localhost,' clusters/oracle/automation/ansible/playbooks/remove-log-retention.yml
          "${RUNNER_TEMP}/ansible-venv/bin/ansible-playbook" --syntax-check -i clusters/proxmox/automation/ansible/inventories/proxmox.yml clusters/proxmox/automation/ansible/playbooks/proxmox-k3s.yml
