name: Validate GitOps manifests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secret-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: Disease-Prediction-ASET26/disease-prediction-ci/.github/workflows/secret-scan.yml@76e94bd640d92a3ffbf20e9cd5914e22b5ca40cd # shared secret scan
    permissions:
      contents: read
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render Oracle manifests
        run: kustomize build clusters/oracle > /dev/null
      - name: Install pinned Ansible Core
        run: |
          python3 -m venv "${RUNNER_TEMP}/ansible-venv"
          "${RUNNER_TEMP}/ansible-venv/bin/python" -m pip install --disable-pip-version-check -r automation/ansible/requirements.txt
      - name: Check Ansible playbook syntax
        run: |
          "${RUNNER_TEMP}/ansible-venv/bin/ansible-playbook" --syntax-check -i 'localhost,' automation/ansible/playbooks/tailscale.yml
          "${RUNNER_TEMP}/ansible-venv/bin/ansible-playbook" --syntax-check -i 'localhost,' automation/ansible/playbooks/remove-tailscale.yml
