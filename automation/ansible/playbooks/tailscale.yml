---
- name: Install and configure Tailscale on the Oracle k3s host
  hosts: all
  become: true
  gather_facts: true

  vars:
    tailscale_hostname: oracle-k3s
    tailscale_tag: tag:oracle-k3s

  tasks:
    - name: Add the official Tailscale stable repository for Oracle Linux 9
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/oracle/9/tailscale.repo
        dest: /etc/yum.repos.d/tailscale.repo
        owner: root
        group: root
        mode: "0644"

    - name: Install Tailscale from its signed stable package repository
      ansible.builtin.dnf:
        name: tailscale
        state: present

    - name: Enable and start the Tailscale service
      ansible.builtin.systemd_service:
        name: tailscaled.service
        enabled: true
        state: started

    - name: Check for Oracle Linux's post-quantum crypto policy module
      ansible.builtin.stat:
        path: /usr/share/crypto-policies/policies/modules/PQ.pmod
      register: tailscale_pq_policy_module

    - name: Require the post-quantum crypto policy module
      ansible.builtin.assert:
        that:
          - tailscale_pq_policy_module.stat.exists
        fail_msg: >-
          The Oracle Linux PQ crypto policy module is missing. Update Oracle
          Linux 9 before enabling post-quantum SSH key exchange.

    - name: Read the current system crypto policy
      ansible.builtin.command:
        argv:
          - /usr/bin/update-crypto-policies
          - --show
      register: tailscale_current_crypto_policy
      changed_when: false

    - name: Add the post-quantum crypto policy module
      ansible.builtin.command:
        argv:
          - /usr/bin/update-crypto-policies
          - --set
          - "{{ tailscale_current_crypto_policy.stdout }}:PQ"
      when: "'PQ' not in tailscale_current_crypto_policy.stdout.split(':')"
      notify: Restart SSH to apply the crypto policy

    - name: Read Tailscale status
      ansible.builtin.command:
        argv:
          - /usr/bin/tailscale
          - status
          - --json
      register: tailscale_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the current backend state
      ansible.builtin.set_fact:
        tailscale_backend_state: >-
          {{ (tailscale_status.stdout | from_json).BackendState
             if tailscale_status.rc == 0 else 'Unknown' }}

    - name: Ask for a one-use Tailscale auth key when the VM is not enrolled
      ansible.builtin.pause:
        prompt: >-
          Enter a one-use, pre-approved Tailscale auth key tagged
          {{ tailscale_tag }}. Input is hidden.
        echo: false
      register: tailscale_auth_key
      no_log: true
      when: tailscale_backend_state != 'Running' and not ansible_check_mode

    - name: Enroll the VM as a tagged Tailscale server
      ansible.builtin.shell: >-
        /usr/bin/tailscale up
        --hostname={{ tailscale_hostname }}
        --advertise-tags={{ tailscale_tag }}
        --auth-key="$TAILSCALE_AUTH_KEY"
      args:
        executable: /bin/bash
      environment:
        TAILSCALE_AUTH_KEY: "{{ tailscale_auth_key.user_input }}"
      no_log: true
      when: tailscale_backend_state != 'Running' and not ansible_check_mode

    - name: Apply the desired hostname and tag to an enrolled VM
      ansible.builtin.command:
        argv:
          - /usr/bin/tailscale
          - up
          - "--hostname={{ tailscale_hostname }}"
          - "--advertise-tags={{ tailscale_tag }}"
      changed_when: false
      when: tailscale_backend_state == 'Running' and not ansible_check_mode

    - name: Confirm the VM is connected to the tailnet
      ansible.builtin.command:
        argv:
          - /usr/bin/tailscale
          - status
          - --json
      register: tailscale_final_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require an authenticated Tailscale connection
      ansible.builtin.assert:
        that:
          - tailscale_final_status.rc == 0
          - (tailscale_final_status.stdout | from_json).BackendState == 'Running'
        fail_msg: >-
          Tailscale is not connected. Check the one-use key, device approval,
          and tag policy, then run this playbook again.
      when: not ansible_check_mode

    - name: Read configured firewalld zones
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-cmd
          - --permanent
          - --get-zones
      register: tailscale_firewalld_zones
      changed_when: false
      check_mode: false

    - name: Create a dedicated firewalld zone for Tailscale
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-cmd
          - --permanent
          - --new-zone=tailscale
      when:
        - not ansible_check_mode
        - "'tailscale' not in tailscale_firewalld_zones.stdout.split()"
      changed_when: true
      notify: Reload firewalld

    - name: Check whether SSH is allowed in the Tailscale firewalld zone
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-cmd
          - --permanent
          - --zone=tailscale
          - --query-service=ssh
      register: tailscale_firewalld_ssh
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Allow SSH in the Tailscale firewalld zone
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-cmd
          - --permanent
          - --zone=tailscale
          - --add-service=ssh
      when:
        - not ansible_check_mode
        - tailscale_firewalld_ssh.rc != 0
      changed_when: true
      notify: Reload firewalld

    - name: Check whether the Kubernetes API is allowed in the Tailscale zone
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-cmd
          - --permanent
          - --zone=tailscale
          - --query-port=6443/tcp
      register: tailscale_firewalld_api
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Allow the Kubernetes API in the Tailscale firewalld zone
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-cmd
          - --permanent
          - --zone=tailscale
          - --add-port=6443/tcp
      when:
        - not ansible_check_mode
        - tailscale_firewalld_api.rc != 0
      changed_when: true
      notify: Reload firewalld

    - name: Check whether tailscale0 is assigned to its firewalld zone
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-cmd
          - --permanent
          - --zone=tailscale
          - --query-interface=tailscale0
      register: tailscale_firewalld_interface
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Assign tailscale0 to its restricted firewalld zone
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-cmd
          - --permanent
          - --zone=tailscale
          - --add-interface=tailscale0
      when:
        - not ansible_check_mode
        - tailscale_firewalld_interface.rc != 0
      changed_when: true
      notify: Reload firewalld

    - name: Add the Tailscale DNS name to the K3s API certificate configuration
      ansible.builtin.blockinfile:
        path: /etc/rancher/k3s/config.yaml
        create: true
        owner: root
        group: root
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED TAILSCALE API ACCESS"
        block: |
          tls-san:
            - {{ tailscale_hostname }}
      register: tailscale_k3s_tls_config

    - name: Rotate the K3s API certificate for the Tailscale DNS name
      when: tailscale_k3s_tls_config.changed and not ansible_check_mode
      block:
        - name: Stop K3s before rotating its API certificate
          ansible.builtin.systemd_service:
            name: k3s.service
            state: stopped

        - name: Rotate the K3s API server certificate
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - certificate
              - rotate
              - --service
              - api-server

      always:
        - name: Ensure K3s is running after certificate rotation
          ansible.builtin.systemd_service:
            name: k3s.service
            state: started

    - name: Read the VM's Tailscale IPv4 address
      ansible.builtin.command:
        argv:
          - /usr/bin/tailscale
          - ip
          - -4
      register: tailscale_ipv4
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Show the private address
      ansible.builtin.debug:
        msg: >-
          Tailscale is connected at {{ tailscale_ipv4.stdout | trim }}.
          Verify private SSH and direct Kubernetes API access from your
          workstation before removing public SSH access.
      when: not ansible_check_mode

  handlers:
    - name: Restart SSH to apply the crypto policy
      ansible.builtin.systemd_service:
        name: sshd.service
        state: restarted

    - name: Reload firewalld
      ansible.builtin.command:
        argv:
          - /usr/bin/firewall-cmd
          - --reload
